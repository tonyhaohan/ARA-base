claims:
- id: C003-01
  statement: bridge bundle 中的 solverPath 只有在 ASTRA适配层把它编译为明确的 QP 和逐跳路由配置后，才能约束真实 packet
    路径。
  conditions: '仅限冻结源Issue #3记载的raw-rank/lane-expanded/high-K桥接接口与已测probe；支持来自历史叙述及接口定义，原始trace和构建未取得，本次未复现。不能推断其他构建、任意拓扑或所有参数皆有相同结果。源claims.md未记载主张作者，provenance=unknown。'
  status: supported
  provenance: unknown
  falsification: 未修改的 raw-rank ASTRA 能直接读取 solverPath 并稳定沿指定完整物理路径发送。
  evidence:
  - E003-03
  observations: []
- id: C003-02
  statement: 把每条 lane 展开为独立 ASTRA rank 可以验证容量，但不能证明一个真实 GPU rank 能以同样方式使用多条路径。
  conditions: '仅限冻结源Issue #3记载的raw-rank/lane-expanded/high-K桥接接口与已测probe；支持来自历史叙述及接口定义，原始trace和构建未取得，本次未复现。不能推断其他构建、任意拓扑或所有参数皆有相同结果。源claims.md未记载主张作者，provenance=unknown。'
  status: supported
  provenance: unknown
  falsification: lane-expanded 与 raw-rank 模型在 rank 数、通信任务和发送资源约束上等价。
  evidence:
  - E003-04
  observations: []
- id: C003-03
  statement: 用几十到数百个 QP 等待 host/switch hash 近似均衡不能表达一个逻辑流允许使用的明确 QP组和完整物理路径。
  conditions: '仅限冻结源Issue #3记载的raw-rank/lane-expanded/high-K桥接接口与已测probe；支持来自历史叙述及接口定义，原始trace和构建未取得，本次未复现。不能推断其他构建、任意拓扑或所有参数皆有相同结果。源claims.md未记载主张作者，provenance=unknown。'
