- id: C004-02
  statement: 在历史Q=2的四条完整路径双向trace验证中，path-specific destination alias加逐跳单出口路由固定了配置内的正向data
    interface；历史实现报告说明未替换RDMA/ACK/PFC/拥塞控制数据面。不据此证明所有拓扑或回程路径语义。
  conditions: 冻结源历史记录范围；配置驱动QP接口及当时有限trace/reuse验证；不是物理硬件真实性证明。
  status: supported
  provenance: unknown
  falsification: 该已测trace出现配置外正向data interface，或取得冻结源码后发现实现通过替换RDMA数据面而非配置原生路由实现；不将未测完整回程行为算入主张。
  evidence:
  - E004-04
  - E004-09
- id: C004-03
  statement: 同一 QP 的连续 message 应共享 sequence 和拥塞控制状态；使用相同 source port 重建临时 QP 不等价于
    QP复用。
  conditions: 冻结源历史记录范围；配置驱动QP接口及当时有限trace/reuse验证；不是物理硬件真实性证明。
  status: hypothesis
  provenance: unknown
  falsification: 两种实现产生完全相同的 QP 生命周期和 sequence state。
  evidence:
  - E004-05
- id: C004-04
  statement: 在已测 N/M/Q/R case 中，R=2/4 相对 R=1 没有稳定容量收益，因此 R=1 是最小可信默认值。
  conditions: 冻结源历史记录范围；仅代表性12个N/M/Q/R粗扫，8,000,000B/有向GPU对，4096B小包；不推广为所有规模最优。
  status: supported
  provenance: unknown
  falsification: 扩大网格后出现可重复且显著的 R>1 容量收益。
  evidence:
  - E004-06
- id: C005-01
  statement: 在相同 QP组上，均匀分配提供严格的小包数平衡，并在 1MiB 配对实验中比哈希分配更稳定且平均仿真时间更低。
  conditions: 1MiB=1048576B，4096B小包，四个代表性N/M/Q拓扑、R=1/2/4共12配对；相同binary/path/QP/native校准。支持仅限该有限比较。
    历史报告支持，原raw未取得，迁移未重跑。
  status: supported
  provenance: unknown
  falsification: 代表性复跑中均匀分配不稳定、出现系统性变慢或比哈希分配更不均衡。
  evidence:
  - E005-02
  - E005-03
  - E005-04
  depends_on:
  - C004-01
  - C004-04
  source_note: '源claim Status=accepted，逐项按已有报告和新迁移契约判断科学状态；源未保存claim作者，使用unknown。原始段落：

