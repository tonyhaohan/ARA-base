  - E003-07
  - E003-08
  - E003-09
  observations: []
- id: C004-01
  statement: QP、路径组、QP组、逻辑流到 QP组的映射和4KB小包 QP选择应由 bridge接口层生成和验证。
  conditions: 冻结源历史记录范围；配置驱动QP接口及当时有限trace/reuse验证；不是物理硬件真实性证明。
  status: hypothesis
  provenance: unknown
  falsification: ASTRA适配层或 ns-3网络层必须搜索或重新决定这些 policy 才能完成受支持实验。
