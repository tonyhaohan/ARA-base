 band.", "result": "The estimate matched the target grid, but it did not prove that ASTRA/ns-3 used the intended physical paths or parallel injection behavior.", "why_it_worked": "The estimate directly encoded the target denominator and residual terms.\n\n### 出处与边界\n\n冻结 `migration/source/ara/trace/exploration_tree.yaml` 中 I003-N02；详细历史命令与变化见 `migration/source/issue3-ExecPlan.md`。本次未复跑；共用元数据中的 overrides仅表示已知差异；空映射不能推断历史没有差异。正文与冻结来源保留实际条件。"}, "I003-N03": {"hypothesis": "Splitting a logical flow across solverPath entries in the bridge bundle will make real ASTRA use all M*Q physical lanes for the same GPU pair.", "method": "Run raw-rank ASTRA probes for single-lane and multi-lane N/M/Q cases.", "result": "Single-lane cases stayed close to theory, while M>1 or Q>1 cases remained near single-lane runtime.", "failure_mode": "Chakra send/recv expresses rank-level communication; solverPath was metadata, not a route or QP binding contract honored by the ns-3 backend.", "lesson": "A bridge path label cannot be treated as proof that packets follow that path.\n\n### 出处与边界\n\n冻结 `migration/source/ara/trace/exploration_tree.yaml` 中 I003-N03；详细历史命令与变化见 `migration/source/issue3-ExecPlan.md`。本次未复跑；共用元数据中的 overrides仅表示已知差异；空映射不能推断历史没有差异。正文与冻结来源保留实际条件。"}, "I003-N04": {"hypothesis": "Representing each lane as an independent ASTRA rank can bypass the per-rank send gate and demonstrate the target M*Q injection capacity.", "method": "Expand each original GPU into M*Q ASTRA ranks and run real matrices up to 2048 ranks.", "result": "Many large-N cases reached the target, but the rank count and communication semantics no longer represented the original GPU cluster.", "lesson": "This proxy is capacity evidence, not a credible replacement for raw GPU ranks.\n\n### 出处与边界\n\n冻结 `migration/source/ara/trace/exploration_tree.yaml` 中 I003-N04；详细历史命令与变化见 `migration/source/issue3-ExecPlan.md`。本次未复跑；共用元数据中的 overrides仅表示已知差异；空映射不能推断历史没有差异。正文与冻结来源保留实际条件。"}, "I003-N05": {"choice": "Keep powers-of-two N, M and Q as the representative target instead of every integer in the original ranges.", "alternatives": "- Complete all integer N/M/Q combinations.\n- Keep only the earliest small probe matrix.", "why_it_worked": "It retained the intended scale and parallelism regimes while reducing run cost.\n\n### 出处与边界\n\n冻结 `migration/source/ara/trace/exploration_tree.yaml` 中 I003-N05；详细历史命令与变化见 `migration/source/issue3-ExecPlan.md`。本次未复跑；共用元数据中的 overrides仅表示已知差异；空映射不能推断历史没有差异。正文与冻结来源保留实际条件。"}, "I003-N06": {"question": "Can 4KB packets, RDMA QPs, host QP hash, switch ECMP, egress round-robin and backend congestion-control parameters reproduce the target without a new explicit QP-to-path configuration interface?\n\n### 出处与边界\n\n冻结 `migration/source/ara/trace/exploration_tree.yaml` 中 I003-N06；详细历史命令与变化见 `migration/source/issue3-ExecPlan.md`。本次未复跑；共用元数据中的 overrides仅表示已知差异；空映射不能推断历史没有差异。正文与冻结来源保留实际条件。"}, "I003-N07": {"hypothesis": "ASTRA native all-to-all implementations will let the backend's RDMA and ECMP behavior naturally use all M*Q paths.", "result": "M=1 direct cases were close to theory, but M>1 and Q>1 missed badly; ring and other native variants were slower or invalid for the target.", "failure_mode": "Native collective and flow/QP-level ECMP did not spray each GPU pair across all intended lanes.", "lesson": "Native all-to-all remains a protocol sanity probe, not the path-control solution.\n\n### 出处与边界\n\n冻结 `migration/source/ara/trace/exploration_tree.yaml` 中 I003-N07；详细历史命令与变化见 `migration/source/issue3-ExecPlan.md`。本次未复跑；共用元数据中的 overrides仅表示已知差异；空映射不能推断历史没有差异。正文与冻结来源保留实际条件。"}, "I003-N08": {"hypothesis": "Many independent RDMA sends per GPU pair will create enough QPs for host and switch hashes to approximate uniform use of the physical paths.", "method": "Sweep stripe count K across representative N/M/Q cases and measure real ASTRA/ns-3 completion time.", "result": "Selected cases reached the target, but results were non-monotonic, required tens or hundreds of QPs, and did not generalize across M and Q.", "lesson": "High-K hashing is a diagnostic approximation, not an explicit or stable path contract.\n\n### 出处与边界\n\n冻结 `migration/source/ara/trace/exploration_tree.yaml` 中 I003-N08；详细历史命令与变化见 `migration/source/issue3-ExecPlan.md`。本次未复跑；共用元数据中的 overrides仅表示已知差异；空映射不能推断历史没有差异。正文与冻结来源保留实际条件。"}, "I003-N09": {"hypothesis": "Replacing parallel links with distinct ECMP next-hop nodes will make Q visible to the unmodified backend and close the remaining gap.", "method": "Export each parallel GPU-switch link through a distinct next-hop node and combine it with QP hash striping.", "result": "Q became measurable and several cases improved, but hash-selected paths and small-N cases remained unstable or above the target.", "lesson": "Making links hash-visible does not let a logical flow choose a named path group.\n\n### 出处与边界\n\n冻结 `migration/source/ara/trace/exploration_tree.yaml` 中 I003-N09；详细历史命令与变化见 `migration/source/issue3-ExecPlan.md`。本次未复跑；共用元数据中的 overrides仅表示已知差异；空映射不能推断历史没有差异。正文与冻结来源保留实际条件。"}, "I003-N10": {"hypothesis": "Congestion-control, queue, rendezvous, delay, source-port, seed or further K tuning can turn the high-K proxy into a general solution.", "result": "Many knobs had no effect or regressed; isolated tuned points improved, but small-N cases and explicit path selection remained unresolved.", "failure_mode": "Hash balance, QP overhead and fixed protocol cost changed together, while the bridge still could not state which complete physical path a QP must follow.", "lesson": "Do not repeat broad parameter search when the missing capability is an explicit QP/path interface.\n\n### 出处与边界\n\n冻结 `migration/source/ara/trace/exploration_tree.yaml` 中 I003-N10；详细历史命令与变化见 `migration/source/issue3-ExecPlan.md`。本次未复跑；共用元数据中的 overrides仅表示已知差异；空映射不能推断历史没有差异。正文与冻结来源保留实际条件。"}, "I003-N11": {"result": "This pivot became the Issue #6 simulator feature: explicit QP configuration, path-specific routes, persistent QP reuse and bridge-side 4KB message allocation.", "trigger": "Issue #3 showed that implicit solverPath metadata, lane-expanded ranks and high-K hash tuning could not provide a small, auditable QP-to-path contract.", "new_direction": "Let the bridge generate a small set of QPs, bind each QP to one complete physical path, group QPs per logical flow and configure the simulator with the fully resolved result.", "why_it_worked": "It converted an opaque statistical approximation into a small inspectable contract while retaining the trusted RDMA data plane.\n\n### 出处与边界\n\n冻结 `migration/source/ara/trace/exploration_tree.yaml` 中 I003-N11；详细历史命令与变化见 `migration/source/issue3-ExecPlan.md`。本次未复跑；共用元数据中的 overrides仅表示已知差异；空映射不能推断历史没有差异。正文与冻结来源保留实际条件。\n\n原Issue #6映射为本仓Issue #4；后继I004-N01由接收节点维护前置依赖，E004-01与E004-08由Issue4迁移记录提供。用户转向不作为新的科学实证。"}, "I004-N01": {"question": "Can each logical flow choose from a user-defined QP group, with every QP fixed to one complete shortest physical path and every 4KB packet choosing a QP once, without replacing native RDMA behavior?\n\n\n### 迁移边界\n\n原记录 I006-N01（accepted）在本次导入中保留；未新验证，其证据为报告记录，原运行产物未取得。"}, "I004-N02": {"hypothesis": "Creating 100 or more QPs and relying on automatic host/switch hashes might produce enough balance to stand in for explicit QP placement.", "result": "The approach requires excessive QPs, hides the actual binding, and cannot express a flow-specific path group or QP group.", "failure_mode": "Statistical hash collisions replace the requested path contract and make balance depend on a large, opaque QP population.", "lesson": "QP placement and 4KB-packet QP selection must be explicit bridge contracts, not consequences of a large hash population.\n\n\n### 迁移边界\n\n原记录 I006-N02（rejected）在本次导入中保留；未新验证，其证据为报告记录，原运行产物未取得。"}, "I004-N03": {"choice": "The bridge defines paths, QPs, QP groups, flow-to-group mappings and 4KB-packet allocation. The simulator reads only resolved configuration.", "alternatives": "- Let the simulator search or generate QPs automatically.\n- Replace switch forwarding behavior with a new path selector.", "why_it_worked": "Policy and validation stay in auditable interface code while the trusted RDMA data plane remains intact.\n\n\n### 迁移边界\n\n原记录 I006-N03（accepted）在本次导入中保留；未新验证，其证据为报告记录，原运行产物未取得。"}, "I004-N04": {"hypothesis": "Source ports whose hashes hit calibrated route slots might provide the explicit path binding needed by the bridge.", "method": "Search source ports for target route slots and calibrate slot-to-interface mapping with native trace.", "result": "Key cases and a five-path 3+2 grouping worked, but route-slot order depended on topology/build iteration order and was not a stable complete-path ABI.", "lesson": "Hash preimages are useful diagnostics, but a credible path contract must name physical edges and must not depend on route-vector order.\n\n\n### 迁移边界\n\n原记录 I006-N04（superseded）在本次导入中保留；未新验证，其证据为报告记录，原运行产物未取得。"}, "I004-N05": {"trigger": "The source-port prototype could not provide a stable complete-path ABI.", "new_direction": "Allocate a destination alias for each complete path and register exactly one output interface for that alias at every hop.", "result": "All four Q=2 complete paths and both directions matched the configured physical interfaces in native trace without changing switch hashing.", "why_it_worked": "Native forwarding hashes only when a destination has multiple outputs; a path-specific alias makes the candidate set size one at every hop.\n\n\n### 迁移边界\n\n原记录 I006-N05（accepted）在本次导入中保留；未新验证，其证据为报告记录，原运行产物未取得。"}, "I004-N06": {"hypothesis": "Retaining a configured QP and queueing later sends should reproduce the connection-lifetime behavior missing from temporary per-send QPs.", "method": "Send two consecutive 1MiB messages using the same configured QP and inspect sequence continuation and completion behavior.", "result": "The second message queued behind the first and continued the same sequence and congestion-control state.", "why_it_worked": "The adapter retains <script>
const D=JSON.parse(document.getElementById('ara-data').textContent), NS='http://www.w3.org/2000/svg';
let mode='issue', selected=null, scale=1;
const $=id=>document.getElementById(id);
$('title').textContent=D.project.title;
for(const [key,label] of [['issues','个 Issue'],['ideas','个 idea'],['evidence','份证据'],['claims','条主张']]){let s=document.createElement('span'),b=document.createElement('b');b.textContent=D.counts[key];s.append(b,' '+label);$('stats').append(s)}

function element(tag,attrs={},text=''){let e=document.createElementNS(NS,tag);for(let[k,v]of Object.entries(attrs))e.setAttribute(k,v);e.textContent=text;return e}

const measure=document.createElement('canvas').getContext('2d');measure.font='600 12.5px system-ui';
function titleLines(text){let lines=[],line='';for(let ch of text){if(measure.measureText(line+ch).width>220){lines.push(line);line=ch}else line+=ch}if(line)lines.push(line);if(lines.length>2){let last=lines[1];while(measure.measureText(last+'…').width>220)last=last.slice(0,-1);return[lines[0],last+'…']}return lines}
function badges(id){let item=D.ideas[id];if(!item?.issue)return [];let i=D.issues[item.issue],b=[];if(i.best_ideas.some(x=>x.id===id))b.push(['当前最佳','best']);if(i.promising_ideas.some(x=>x.id===id))b.push(['研究潜力','potential']);return b}
function buttons(ids,targetMode){let box=document.createElement('div');box.className='links';for(let id of ids){let b=document.createElement('button');b.textContent=id;b.onclick=()=>{mode=targetMode;selected=String(id);draw();show(String(id))};box.append(b)}$('detail').append(box)}
function show(id){selected=id;let p=$('detail');p.replaceChildren();if(mode==='issue'){let i=D.issues[id];if(!i)return;addText('h2','#'+id+' · '+i.title);p.append(badge(i.outcome));addText('p',i.summary);let a=document.createElement('a');a.href=i.url;a.textContent='打开 GitHub Issue';a.target='_blank';a.rel='noopener';p.append(a);addText('h3','前置 Issue');buttons(i.depends_on,'issue');for(const[key,label,kind]of[['best_ideas','目前效果最好','best'],['promising_ideas','最有研究潜力','potential']]){addText('h3',label);for(let entry of i[key]){p.append(badge(entry.id,kind));addText('p',entry.reason);buttons([entry.id],'idea')}}addText('h3','该 Issue 的全部 idea');buttons(Object.keys(D.ideas).filter(n=>D.ideas[n].issue===Number(id)),'idea');}
else{let n=D.ideas[id];if(!n)return;addText('h2',id+' · '+n.title);p.append(badge(n.type),badge(n.status||'虚拟根'));for(let[b,k]of badges(id))p.append(badge(b,k));if(id==='I000-N00'){addText('p','虚拟研究起点，不是科学证据，不对应真实 Issue。');addText('h3','开启的研究');buttons(D.successors[id],'idea');return;}addText('h3','前置 idea');buttons(n.depends_on,'idea');addText('p','主要承接：'+n.primary_dependency);addText('h3','自动反推的后继');buttons(D.successors[id],'idea');if(D.details[id]?.lesson){addText('h3','经验与边界');addText('p',D.details[id].lesson)}addText('h3','证据');for(let eid of n.evidence){let e=D.evidence[eid];p.append(badge(eid));addText('p',e.summary);addText('p','原始产物：'+e.raw_availability);let box=document.createElement('details');let s=document.createElement('summary');s.textContent='位置、身份和复现说明';box.append(s);addText('pre',JSON.stringify(e,null,2),box);p.append(box)}addText('h3','按需读取');addText('pre','python scripts/ara.py read '+id);let b=document.createElement('button');b.textContent='查看公共条件 + 当前 idea 纪要';b.onclick=()=>{if(!$('memo')){let pre=addText('pre',D.notes[id]);pre.id='memo';}else $('memo').remove()};p.append(b);}}
function draw(){const scope=$('issue-filter').value,query=$('search').value.toLowerCase();let records=mode==='issue'?D.issues:D.ideas;
let ids=Object.keys(records).filter(id=>{let n=records[id];return (!scope||(mode==='issue'?id===scope:String(n.issue)===scope))&&(!query||(id+' '+n.title).toLowerCase().includes(query))});
// 选中节点及其直接前置保持可见；不会把所有祖先默认展开。
if(selected&&records[selected]&&!ids.includes(selected))ids.push(selected);
for(let id of [...ids])for(let dependency of records[id].depends_on){let d=String(dependency);if(!ids.includes(d))ids.push(d)}
$('issue-mode').classList.toggle('active',mode==='issue');$('idea-mode').classList.toggle('active',mode==='idea');let c=$('canvas');c.replaceChildren();if(!ids.length){let p=document.createElement('p');p.className='empty';p.textContent='尚无研究记录。创建关联 Issue 后开始记录第一个问题。';c.append(p);return;}
let incoming={},outgoing={},depth={},queue=[];for(let id of ids){incoming[id]=records[id].depends_on.map(String).filter(x=>ids.includes(x));outgoing[id]=[];depth[id]=0}for(let id of ids)for(let dep of incoming[id])outgoing[dep].push(id);queue=ids.filter(id=>incoming[id].length===0).sort();while(queue.length){let id=queue.shift();for(let next of outgoing[id]){depth[next]=Math.max(depth[next],depth[id]+1);incoming[next]=incoming[next].filter(x=>x!==id);if(!incoming[next].length)queue.push(next)}}
let row={},pos={};for(let id of ids.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))){let d=depth[id],i=row[d]||0;pos[id]=[30+i*285,30+d*155];row[d]=i+1}let width=Math.max(...Object.values(pos).map(p=>p[0]))+285,height=Math.max(...Object.values(pos).map(p=>p[1]))+145;let svg=element('svg',{width:width*scale,height:height*scale,viewBox:`0 0 ${width} ${height}`,role:'group','aria-label':mode==='issue'?'Issue依赖':'Idea依赖'});let defs=element('defs'),marker=element('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto'});marker.append(element('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#91a3ad'}));defs.append(marker);svg.append(defs);
for(let id of ids)for(let dep of records[id].depends_on){dep=String(dep);if(!pos[dep])continue;let[x1,y1]=pos[dep],[x2,y2]=pos[id];x1+=125;y1+=105;x2+=125;let mid=(y1+y2)/2;svg.append(element('path',{d:`M${x1},${y1} C${x1},${mid} ${x2},${mid} ${x2},${y2}`,class:'edge '+(mode==='issue'||records[id].primary_dependency===dep?'primary':'secondary'),'marker-end':'url(#arrow)'}))}
for(let id of ids){let n=records[id],[x,y]=pos[id],g=element('g',{class:'node '+(id===selected?'selected ':'')+(id==='I000-N00'?'root ':'')+(['rejected','failed'].includes(n.status)||n.outcome==='failed'?'failed':''),tabindex:0,role:'button','aria-label':(mode==='issue'?'Issue #':'')+id+' '+n.title});g.append(element('rect',{x,y,width:250,height:105,rx:9}));g.append(element('text',{x:x+13,y:y+23,'font-size':11,fill:'#687a86'},(mode==='issue'?'Issue #':'')+id+' · '+(n.outcome||n.type)));let chunks=titleLines(n.title);chunks.forEach((s,i)=>g.append(element('text',{x:x+13,y:y+47+i*19,'font-size':12.5,'font-weight':600},s)));let label=mode==='idea'?badges(id).map(x=>x[0]).join(' · '):n.status;if(label)g.append(element('text',{x:x+13,y:y+91,'font-size':10.5,fill:'#28715f'},label));g.onclick=()=>{show(id);draw()};g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(id);draw()}};svg.append(g)}c.append(svg);if(selected&&pos[selected]){c.scrollTop=Math.max(0,pos[selected][1]*scale-25);c.scrollLeft=Math.max(0,pos[selected][0]*scale-25)}}
function clearDetail(){selected=null;$('detail').replaceChildren();addText('h2','选择一个研究节点');addText('p','点击卡片查看总结、依赖和按需提取的纪要。')}
$('issue-mode').onclick=()=>{mode='issue';clearDetail();draw()};$('idea-mode').onclick=()=>{mode='idea';clearDetail();draw()};$('issue-filter').onchange=()=>{clearDetail();draw()};$('search').oninput=()=>{clearDetail();draw()};$('zoom-in').onclick=()=>{scale=Math.min(1.8,scale+.15);draw()};$('zoom-out').onclick=()=>{scale=Math.max(.45,scale-.15);draw()};$('reset').onclick=()=>{scale=1;clearDetail();$('issue-filter').value='';$('search').value='';draw()};draw();
</script></body></html>
