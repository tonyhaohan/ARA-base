aside { align-self:start; position:sticky; top:16px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
aside h2 { margin:0 0 12px; font-size:17px; }
dl { margin:0; } dt { margin-top:10px; color:var(--muted); font-size:12px; } dd { margin:2px 0 0; white-space:pre-wrap; }
@media (max-width:800px) { main { grid-template-columns:1fr; } aside { position:static; } }

<script>
const nodes = [{"id": "I003-N01", "type": "question", "title": "Can native ASTRA reproduce the Clos N/M/Q target with realistic positive gap?", "status": "accepted", "provenance": "user", "source_issues": [3], "timestamp": "2026-07-03T00:00:00+08:00", "question": "For N GPUs, M switches and Q equal-bandwidth GPU-switch links, can real ASTRA/ns-3 reproduce the 8MB all-to-all target divided by M and Q while retaining fixed protocol overhead and packet-tail effects?\n", "evidence": ["E003-01"], "next": ["I003-N02", "I003-N03"]}, {"id": "I003-N02", "type": "experiment", "title": "A calibrated bridge estimate matches the target grid but is not simulator evidence", "status": "accepted", "provenance": "ai-executed", "source_issues": [3], "timestamp": "2026-07-03T00:05:00+08:00", "hypothesis": "The theoretical denominator plus fixed protocol overhead, proportional overhead and packet-tail imbalance can provide a useful calibration baseline.\n", "method": "Generate the N/M/Q grid with a bridge-side analytical estimate and compare it with the requested positive-gap band.\n", "result": "The estimate matched the target grid, but it did not prove that ASTRA/ns-3 used the intended physical paths or parallel injection behavior.\n", "evidence": ["E003-02"], "why_it_worked": "The estimate directly encoded the target denominator and residual terms.\n", "next": ["I003-N03"]}, {"id": "I003-N03", "type": "dead_end", "title": "Bundle solverPath does not control raw-rank ASTRA multi-lane injection", "status": "rejected", "provenance": "ai-executed", "source_issues": [3], "timestamp": "2026-07-03T00:50:00+08:00", "hypothesis": "Splitting a logical flow across solverPath entries in the bridge bundle will make real ASTRA use all M*Q physical lanes for the same GPU pair.\n", "method": "Run raw-rank ASTRA probes for single-lane and multi-lane N/M/Q cases.\n", "result": "Single-lane cases stayed close to theory, while M>1 or Q>1 cases remained near single-lane runtime.\n", "failure_mode": "Chakra send/recv expresses rank-level communication; solverPath was metadata, not a route or QP binding contract honored by the ns-3 backend.\n", "evidence": ["E003-03"], "lesson": "A bridge path label cannot be treated as proof that packets follow that path.\n", "next": ["I003-N04", "I003-N06"]}, {"id": "I003-N04", "type": "experiment", "title": "Lane-expanded ranks expose capacity but change the modeled system", "status": "partial", "provenance": "ai-executed", "source_issues": [3], "timestamp": "2026-07-03T01:20:00+08:00", "hypothesis": "Representing each lane as an independent ASTRA rank can bypass the per-rank send gate and demonstrate the target M*Q injection capacity.\n", "method": "Expand each original GPU into M*Q ASTRA ranks and run real matrices up to 2048 ranks.\n", "result": "Many large-N cases reached the target, but the rank count and communication semantics no longer represented the original GPU cluster.\n", "evidence": ["E003-04"], "lesson": "This proxy is capacity evidence, not a credible replacement for raw GPU ranks.\n", "next": ["I003-N05", "I003-N06"]}, {"id": "I003-N05", "type": "decision", "title": "Narrow the calibration grid to powers of two", "status": "accepted", "provenance": "user", "source_issues": [3], "timestamp": "2026-07-03T09:09:00+08:00", "choice": "Keep powers-of-two N, M and Q as the representative target instead of every integer in the original ranges.\n", "alternatives": ["Complete all integer N/M/Q combinations.", "Keep only the earliest small probe matrix."], "evidence": ["E003-01", "E003-04"], "why_it_worked": "It retained the intended scale and parallelism regimes while reducing run cost.\n", "next": ["I003-N06"]}, {"id": "I003-N06", "type": "question", "title": "Can native RDMA QP and ECMP semantics meet the target without explicit routes?", "status": "open", "provenance": "user", "source_issues": [3], "timestamp": "2026-07-03T14:00:00+08:00", "question": "Can 4KB packets, RDMA QPs, host QP hash, switch ECMP, egress round-robin and backend congestion-control parameters reproduce the target without a new explicit QP-to-path configuration interface?\n", "evidence": ["E003-05", "E003-06", "E003-07", "E003-08"], "next": ["I003-N07", "I003-N08", "I003-N09"]}, {"id": "I003-N07", "type": "dead_end", "title": "Native all-to-all preserves standard semantics but misses M/Q scaling", "status": "rejected", "provenance": "ai-executed", "source_issues": [3], "timestamp": "2026-07-03T14:40:00+08:00", "hypothesis": "ASTRA native all-to-all implementations will let the backend's RDMA and ECMP behavior naturally use all M*Q paths.\n", "result": "M=1 direct cases were close to theory, but M>1 and Q>1 missed badly; ring and other native variants were slower or invalid for the target.\n", "failure_mode": "Native collective and flow/QP-level ECMP did not spray each GPU pair across all intended lanes.\n", "evidence": ["E003-05"], "lesson": "Native all-to-all remains a protocol sanity probe, not the path-control solution.\n", "next": ["I003-N08"]}, {"id": "I003-N08", "type": "experiment", "title": "High-K QP hash striping improves throughput but is unstable and indirect", "status": "partial", "provenance": "ai-executed", "source_issues": [3], "timestamp": "2026-07-03T16:10:00+08:00", "hypothesis": "Many independent RDMA sends per GPU pair will create enough QPs for host and switch hashes to approximate uniform use of the physical paths.\n", "method": "Sweep stripe count K across representative N/M/Q cases and measure real ASTRA/ns-3 completion time.\n", "result": "Selected cases reached the target, but results were non-monotonic, required tens or hundreds of QPs, and did not generalize across M and Q.\n", "evidence": ["E003-06"], "lesson": "High-K hashing is a diagnostic approximation, not an explicit or stable path contract.\n", "next": ["I003-N09", "I003-N10"]}, {"id": "I003-N09", "type": "experiment", "title": "ECMP-visible topology exposes parallel links but still does not define paths", "status": "partial", "provenance": "ai-executed", "source_issues": [3], "timestamp": "2026-07-03T18:05:00+08:00", "hypothesis": "Replacing parallel links with distinct ECMP next-hop nodes will make Q visible to the unmodified backend and close the remaining gap.\n", "method": "Export each parallel GPU-switch link through a distinct next-hop node and combine it with QP hash striping.\n", "result": "Q became measurable and several cases improved, but hash-selected paths and small-N cases remained unstable or above the target.\n", "evidence": ["E003-07"], "lesson": "Making links hash-visible does not let a logical flow choose a named path group.\n", "next": ["I003-N10"]}, {"id": "I003-N10", "type": "dead_end", "title": "Backend knobs and further hash tuning do not create a general route contract", "status": "rejected", "provenance": "ai-executed", "source_issues": [3], "timestamp": "2026-07-03T19:40:00+08:00", "hypothesis": "Congestion-control, queue, rendezvous, delay, source-port, seed or further K tuning can turn the high-K proxy into a general solution.\n", "result": "Many knobs had no effect or regressed; isolated tuned points improved, but small-N cases and explicit path selection remained unresolved.\n", "failure_mode": "Hash balance, QP overhead and fixed protocol cost changed together, while the bridge still could not state which complete physical path a QP must follow.\n", "evidence": ["E003-08"], "lesson": "Do not repeat broad parameter search when the missing capability is an explicit QP/path interface.\n", "next": ["I003-N11"]}, {"id": "I003-N11", "type": "pivot", "title": "Replace the high-K proxy with explicit configuration-driven QP paths", "status": "accepted", "provenance": "user-revised", "source_issues": [3, 6], "timestamp": "2026-07-10T18:41:00+08:00", "trigger": "Issue #3 showed that implicit solverPath metadata, lane-expanded ranks and high-K hash tuning could not provide a small, auditable QP-to-path contract.\n", "new_direction": "Let the bridge generate a small set of QPs, bind each QP to one complete physical path, group QPs per logical flow and configure the simulator with the fully resolved result.\n", "result": "This pivot became the Issue #6 simulator feature: explicit QP configuration, path-specific routes, persistent QP reuse and bridge-side 4KB message allocation.\n", "evidence": ["E003-09", "E006-01", "E006-08"], "why_it_worked": "It converted an opaque statistical approximation into a small inspectable contract while retaining the trusted RDMA data plane.\n", "next": ["I006-N01"]}, {"id": "I006-N01", "type": "question", "title": "Can a small explicit QP group express solver-selected paths credibly?", "status": "accepted", "provenance": "user", "source_issues": [6], "timestamp": "2026-07-10T18:41:00+08:00", "question": "Can each logical flow choose from a user-defined QP group, with every QP fixed to one complete shortest physical path and every 4KB packet choosing a QP once, without replacing native RDMA behavior?\n", "evidence": ["E006-01"], "next": ["I006-N02", "I006-N03"]}, {"id": "I006-N02", "type": "dead_end", "title": "High-K automatic QP hash cannot serve as the path contract", "status": "rejected", "provenance": "user", "source_issues": [6], "timestamp": "2026-07-10T18:41:00+08:00", "hypothesis": "Creating 100 or more QPs and relying on automatic host/switch hashes might produce enough balance to stand in for explicit QP placement.\n", "result": "The approach requires excessive QPs, hides the actual binding, and cannot express a flow-specific path group or QP group.\n", "failure_mode": "Statistical hash collisions replace the requested path contract and make balance depend on a large, opaque QP population.\n", "evidence": ["E006-02"], "lesson": "QP placement and 4KB-packet QP selection must be explicit bridge contracts, not consequences of a large hash population.\n", "next": ["I006-N03"]}, {"id": "I006-N03", "type": "decision", "title": "Put QP plans and packet allocation in the bridge", "status": "accepted", "provenance": "user", "source_issues": [6], "timestamp": "2026-07-10T18:41:00+08:00", "choice": "The bridge defines paths, QPs, QP groups, flow-to-group mappings and 4KB-packet allocation. The simulator reads only resolved configuration.\n", "alternatives": ["Let the simulator search or generate QPs automatically.", "Replace switch forwarding behavior with a new path selector."], "evidence": ["E006-01"], "why_it_worked": "Policy and validation stay in auditable interface code while the trusted RDMA data plane remains intact.\n", "next": ["I006-N04", "I006-N07"]}, {"id": "I006-N04", "type": "experiment", "title": "Source-port preimage and route-slot manifests form a useful prototype", "status": "superseded", "provenance": "ai-executed", "source_issues": [6], "timestamp": "2026-07-10T21:20:00+08:00", "hypothesis": "Source ports whose hashes hit calibrated route slots might provide the explicit path binding needed by the bridge.\n", "method": "Search source ports for target route slots and calibrate slot-to-interface mapping with native trace.\n", "result": "Key cases and a five-path 3+2 grouping worked, but route-slot order depended on topology/build iteration order and was not a stable complete-path ABI.\n", "evidence": ["E006-03"], "lesson": "Hash preimages are useful diagnostics, but a credible path contract must name physical edges and must not depend on route-vector order.\n", "next": ["I006-N05"]}, {"id": "I006-N05", "type": "pivot", "title": "Use path-specific destination aliases and one output per hop", "status": "accepted", "provenance": "ai-suggested", "source_issues": [6], "timestamp": "2026-07-11T19:22:00+08:00", "trigger": "The source-port prototype could not provide a stable complete-path ABI.\n", "new_direction": "Allocate a destination alias for each complete path and register exactly one output interface for that alias at every hop.\n", "result": "All four Q=2 complete paths and both directions matched the configured physical interfaces in native trace without changing switch hashing.\n", "evidence": ["E006-04"], "why_it_worked": "Native forwarding hashes only when a destination has multiple outputs; a path-specific alias makes the candidate set size one at every hop.\n", "next": ["I006-N06", "I006-N08"]}, {"id": "I006-N06", "type": "experiment", "title": "Persistent QP FIFO preserves connection-level state", "status": "accepted", "provenance": "ai-executed", "source_issues": [6], "timestamp": "2026-07-11T19:24:00+08:00", "hypothesis": "Retaining a configured QP and queueing later sends should reproduce the connection-lifetime behavior missing from temporary per-send QPs.\n", "method": "Send two consecutive 1MiB messages using the same configured QP and inspect sequence continuation and completion behavior.\n", "result": "The second message queued behind the first and continued the same sequence and congestion-control state.\n", "evidence": ["E006-05"], "why_it_worked": "The adapter retains the QP after message completion and advances its sequence space instead of invoking temporary-QP teardown.\n", "next": ["I006-N10"]}, {"id": "I006-N07", "type": "dead_end", "title": "An external public ns-3 PR is the wrong repository boundary", "status": "rejected", "provenance": "ai-executed", "source_issues": [6], "timestamp": "2026-07-11T01:07:00+08:00", "hypothesis": "The minimal backend change should be contributed directly to the public astra-network-ns3 repository.\n", "result": "The project did not own a private counterpart there, so the PR was withdrawn and the dependency chain was paused.\n", "failure_mode": "The proposed delivery changed a repository outside the user's ownership and split a small private simulator modification across unnecessary repositories.\n", "evidence": ["E006-07"], "lesson": "Simulator changes must stay in repositories the project owns; nested ns-3 can remain inside the private ASTRA repository.\n", "next": ["I006-N10"]}, {"id": "I006-N08", "type": "experiment", "title": "Sweep one, two and four QPs per complete path", "status": "accepted", "provenance": "ai-executed", "source_issues": [6], "timestamp": "2026-07-11T19:29:00+08:00", "hypothesis": "More than one QP per complete path might improve capacity or stability.\n", "method": "Run representative N/M/Q topologies with R=1,2,4 using the same path calibration and compare simulation time, theory gap and PFC events.\n", "result": "All 12 final cases succeeded; R changed completion time by at most 0.79% relative to R=1 and produced no stable capacity gain.\n", "evidence": ["E006-06"], "why_it_worked": "The experiment isolates QP multiplicity while holding physical capacity and path definitions constant.\n", "next": ["I006-N09"]}, {"id": "I006-N09", "type": "decision", "title": "Default to one QP per complete physical path", "status": "accepted", "provenance": "ai-executed", "source_issues": [6], "timestamp": "2026-07-11T19:29:00+08:00", "choice": "Use R=1 as the default; retain R=2 and R=4 as benchmark dimensions rather than assumed performance improvements.\n", "alternatives": ["Add multiple QPs per path by default.", "Tune R independently for every topology."], "evidence": ["E006-06"], "why_it_worked": "It is the smallest configuration consistent with measured capacity and avoids recreating the excessive-QP complexity.\n", "next": ["I006-N10"]}, {"id": "I006-N10", "type": "decision", "title": "Accept the minimal configuration-driven persistent-QP adapter", "status": "accepted", "provenance": "user-revised", "source_issues": [6], "timestamp": "2026-07-11T21:52:00+08:00", "choice": "Adopt the merged resolved-QP interface, complete-path aliases, persistent QP FIFO and standard benchmark as the new simulator foundation.\n", "alternatives": ["Continue the Issue", "Expand simulator core routing behavior."], "evidence": ["E006-08", "E006-09"], "why_it_worked": "Policy remains in the bridge, adapter changes are narrow, nested ns-3 changes only persistent completion behavior, and native traces check complete paths.\n", "known_limits": "Clean Linux build and paper-grade rerun remain open archive work.\n", "next": ["I009-N01"]}, {"id": "I009-N01", "type": "question", "title": "Should uniform allocation replace hash as the default?", "status": "accepted", "provenance": "user", "source_issues": [9], "timestamp": "2026-07-11T23:21:00+08:00", "question": "For a 1MiB logical flow over the same QP group, how much do hash and round-robin differ in balance and simulation time, and is round-robin stable enough to become the default?\n", "evidence": ["E009-01"], "also_depends_on": ["I006-N10"], "next": ["I009-N02"]}, {"id": "I009-N02", "type": "experiment", "title": "Run paired 1MiB hash and round-robin cases", "status": "accepted", "provenance": "ai-executed", "source_issues": [9], "timestamp": "2026-07-11T23:39:00+08:00", "hypothesis": "Round-robin should reduce QP load dispersion and should not make completion time worse when paths and QPs are held constant.\n", "method": "Use four representative N/M/Q topologies and R=1,2,4. Hold binary, complete paths, QPs and trace calibration constant across each policy pair.\n", "result": "All 24 real runs completed with zero PFC and conserved bytes/FCT. Round-robin was never slower and improved mean completion time by 5.02%.\n", "evidence": ["E009-02"], "why_it_worked": "Pairing changes only 4KB-packet QP selection, isolating the allocation policy.\n", "also_depends_on": ["I006-N08"], "next": ["I009-N03", "I009-N04"]}, {"id": "I009-N03", "type": "experiment", "title": "Measure active QPs and per-flow message-count spread", "status": "accepted", "provenance": "ai-executed", "source_issues": [9], "timestamp": "2026-07-11T23:43:00+08:00", "hypothesis": "Hash can leave configured QPs unused and produce visible per-flow imbalance even when the same group supports exact uniform allocation.\n", "method": "Separate configured QPs, active QPs and FCT rows, and compute the maximum per-flow QP message-count difference.\n", "result": "Hash spread reached 32 and left two of 384 QPs unused in one case; round-robin spread was zero in every tested group.\n", "evidence": ["E009-03"], "why_it_worked": "The metric observes actual packet assignment instead of assuming configured QPs all carry traffic.\n", "next": ["I009-N04", "I009-N05"]}, {"id": "I009-N04", "type": "decision", "title": "Make uniform allocation the default and retain explicit hash", "status": "accepted", "provenance": "user-revised", "source_issues": [9], "timestamp": "2026-07-11T23:43:00+08:00", "choice": "Plans without messageAllocation and the standard benchmark use round_robin; messageAllocation=hash remains deterministic and supported.\n", "alternatives": ["Keep hash as the default.", "Remove hash entirely."], "evidence": ["E009-02", "E009-03", "E009-04"], "why_it_worked": "Uniform allocation met stability, balance and performance criteria while preserving hash as a controlled comparison.\n", "also_depends_on": ["I006-N03", "I006-N09"], "next": ["I009-N05"]}, {"id": "I009-N05", "type": "decision", "title": "Preserve legacy hash rows and distinguish active QPs", "status": "accepted", "provenance": "ai-suggested", "source_issues": [9], "timestamp": "2026-07-11T23:44:00+08:00", "choice": "Interpret summaries without allocation metadata as hash rows and record configured QPs, active QPs and FCT rows separately in new summaries.\n", "alternatives": ["Apply the new default retroactively to old rows.", "Reject every old run root."], "evidence": ["E009-03", "E009-04"], "why_it_worked": "Historical evidence keeps its original meaning after the default changes.\n", "next": ["I009-N06"]}, {"id": "I009-N06", "type": "question", "title": "Can ASTRA build artifacts be safely reused by commit SHA?", "status": "accepted", "provenance": "user", "source_issues": [9], "timestamp": "2026-07-11T23:48:00+08:00", "question": "Can compiled artifact names contain the first seven ASTRA commit characters, reuse a matching build before each run, and rebuild on mismatch
