observations:
  - id: O006-20260915-historical-hash-microdifference
    timestamp: "2026-09-15T19:15:00+08:00"
    provenance: ai-executed
    source_issues: [6]
    text: >
      Four Linux R=1 hash times approximately reproduce the historical 8MB table,
      but three differ by up to 0.1843%. Current repeats match exactly. Main model
      settings and explicit allocation code match; historical macOS raw binary
      and complete artifacts are unavailable locally. Platform difference is
      observed, not established as the cause; maxR calibration is not a demonstrated cause.
    promotion_condition: Obtain historical raw inputs/binary or a controlled diagnostic that identifies the cause without changing model semantics.
  - id: O009-20260916-residual-gap-and-pfc
    timestamp: "2026-09-16T11:11:16+08:00"
    provenance: ai-executed
    source_issues: [9]
    text: >
      I009-N13 records two separate unresolved observations: 8/2/4 takes 151.714us
      with zero PFC and gap8.36714%, versus equal-ideal-capacity8/4/2 at148.855us;
      32/2/2 has156 received pause and156 received resume events per repeat,
      but gap4.28194%. Native input and calibration checks pass. Neither event
      counts nor topology correlation quantify causal latency contributions.
    resolution: I009-N15 and I009-N16 establish omitted parallel ACK return interfaces and an effective isolated candidate; the separate PFC-only latency contribution remains open in I009-N17.
    promotion_condition: Complete integration/regression and isolate remaining timing contributions; do not equate the route-change benefit with PFC-only delay.
  - id: O019-20260917-small-case-qp-regression
    timestamp: "2026-09-17T15:52:29+08:00"
    provenance: ai-executed
    source_issues: [19]
    text: >
      The fixed S4 N8/8MB run reports 1152.163us for same-leaf 1QP and 1153.334us
      for 4QP, a 1.171us regression with exact per-variant repeat. The source and
      physics are frozen and the baseline matches Issue17. More QPs therefore
      need not improve this low-gap control; independent raw evidence and pause/window
      analysis are pending at this observation timestamp. Do not attribute the
      small difference to PFC, fairness or hardware without supporting evidence.
    promotion_condition: Finish raw-artifact/trace checks and paired timeline analysis; record the measured non-monotonicity, retaining uncertainty about isolated causal contributions.
    resolution: I019-N02 and I019-N03 confirm the measured regression after four paired audits and analyses. Both N8 variants have zero PFC and zero window-blocked pending time, identical busy time and an additional 1.171us unpaused idle in the candidate. The observed non-monotonicity is mature; the unique causal attribution of that final wait remains unisolated.
